<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
</head>
<body>
    <h1 class="heading">Quiz App</h1>
    <div class="container">

        <!-- Start Screen -->
        <div class="screen active" id="start-screen">
           <h1>Quiz Time!</h1>
           <p>Test your knowledge with these fun questions</p>
           <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div class="screen" id="quiz-screen">
          
            <div class="quiz-header">
                <h2 id="question-text">
                    Question
                </h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> - <span id="totalQuestions">5</span></p>
                    <p>score: <span id="score">0</span></p>
                </div>
            </div>
            <div class="answers-container" id="answers-container">
                <!-- Answers will be displayed Dynamically using javascript -->
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <!-- Results Screen -->
         <div class="screen" id="result-screen">
           <h1>Quiz results</h1>
           <div class="result-info">
                <p>You scored <span id="final-score">0</span> Out of <span id="max-score"> 5</span></p>
                <div id="result-message">
                    <p>Good Job</p>
                </div>
           </div>
           <button id="restart-btn">Restart Quiz</button>
         </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
