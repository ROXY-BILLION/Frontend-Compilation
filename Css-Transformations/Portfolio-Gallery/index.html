<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Gallery Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="gallery-container">
        <h1 class="gallery-heading">Portfolio Gallery</h1>
        
        <div class="portfolio-grid">
            
            <div class="portfolio-item">

                    <div class="layer-mask"></div>
                    <div class="caption-box">
                        <h2 class="project-title">Project Alpha</h2>
                        <p class="project-tag">Product Design</p>
                    </div>
                </div>
            </div>

            <div class="portfolio-item">
                <div class="media-box">

                    <div class="caption-box">
                        <h2 class="project-title">Project Beta</h2>
                        <p class="project-tag">Web Engineering</p>
                    </div>
                </div>
            </div>

            <div class="portfolio-item">
                <div class="media-box">
                    <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=600&q=80" alt="Brand Identity Concept" class="portfolio-img">

                    <div class="caption-box">

                    </div>
                </div>
            </div>

            <div class="portfolio-item">
                <div class="media-box">

                    <div class="caption-box">
                        <h2 class="project-title">Project Delta</h2>
                        <p class="project-tag">Digital Architecture</p>
                    </div>
                </div>
            </div>

            <div class="portfolio-item">
                <div class="media-box">
                    <img src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d?auto=format&fit=crop&w=600&q=80" alt="UX Wireframing Workflow" class="portfolio-img">

                    <div class="caption-box">

            </div>

            <div class="portfolio-item">
                <div class="media-box">

                    <div class="caption-box">
                        <h2 class="project-title">Project Zeta</h2>
                        <p class="project-tag">Mobile Platforms</p>
                    </div>
                </div>
            </div>

        </div>

</html>
