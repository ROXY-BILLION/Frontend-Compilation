<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Xclusive-Stores</h1>
            <div class="search">
                Search Products:<input type="text" name="text" id=""><input type="submit" value="submit">
            </div>
            <h3>Cart(2)</h3>
        </div>
    </header>
    <div class="main">
     <div class="categories">
        <h2>Categories</h2>
        <ul class="list">
            <li><a href="">Phones</a></li>
            <li><a href="">Laptops</a></li>
            <li><a href="">Watches</a></li>
            <li><a href="">Shoes</a></li>
        </ul>
     </div>
     <div class="filters">
        <h2>Filters</h2>
        <div class="card-layout">
            <div class="card">
                <img src="images/Headphones.jpeg" alt="">
                <h3>Headphone</h3>
                <p>#120,000</p>
                <button>Add Cart</button>
            </div>
            <div class="card">
                <img src="images/smartwatch.jpeg" alt="">
                <h3>SmartWatch</h3>
                <p>#80,000</p>
                <button>Add Cart</button>
            </div>
            <div class="card">
                <img src="images/sunglasses.jpeg" alt="">
                <h3>Sunglasses</h3>
                <p>#20,000</p>
                <button>Add Cart</button>
            </div>
        </div>
     </div>
    </div>
</body>
</html>
