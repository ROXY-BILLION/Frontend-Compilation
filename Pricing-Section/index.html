<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing-Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="price-catalogue">
        <h1>Our Pricing</h1>
        <div class="pricing">
            <div class="card">
                <h2>Basic</h2>
                <h3>#5,000/Month</h3>
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Choose</button>
            </div>
            <div class="card">
                <h2>Pro</h2>
                <h3>#15,000/Month</h3>
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Choose</button>
            </div>
            <div class="card">
                <h2>Premium</h2>
                <h3>#30,000/Month</h3>
                <p>Feature 1</p>
                <p>Feature 2</p>
                <p>Feature 3</p>
                <button>Choose</button>
            </div>
        </div>
    </div>
</body>
</html>
