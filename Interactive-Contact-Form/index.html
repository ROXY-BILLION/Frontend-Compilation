<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact">
        <h1>Contact Form</h1>
        <form action="" class="form" id="contact-form">
         <label for="name">Name</label>
         <input type="text" placeholder="input your name" id="name" required>
         
         <label for="email">Email</label>
         <input type="email" placeholder="input your email" id="email" required>

         <label for="text">Message</label>
         <textarea name="text" id="textarea" placeholder="write us a message" required></textarea>

         <input type="submit" value="Submit" class="btn">
        </form>
    </div>
    <p id="KeyDisplay">Press Any Key....</p>

    <script src="script.js"></script>
</body>
</html>
