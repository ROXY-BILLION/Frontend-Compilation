<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="key">
        <h1>Key board Controller</h1>
        <p>Press any key on your keyboard...</p>
    </div>
    <div class="lastkey">
        <p>Last Key: <span id="key">None</span></p>
    </div>
    <div class="status">
        <span id="status">Waiting...</span>
    </div>
    <div class="instructions">
        <h3>instructions</h3>
        <ul>
            <li> Press Enter  → Submit</li>
            <li> Press Escape → Cancel</li>
            <li> Press Space  → Jump </li>
            <li> Press ← → ↑ ↓ → Move</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
