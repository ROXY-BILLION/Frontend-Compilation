<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-box">
        <div class="card">
           <img src="images/Headphones.jpeg" alt=""> 
           <h2>Headphones</h2>
           <p>Cheap Headphones</p>
        </div>
        <div class="card">
           <img src="images/laptop bag.jpeg" alt=""> 
           <h2>Laptop Bag</h2>
           <p>Cheap Laptop Bag</p>
        </div>
        <div class="card">
           <img src="images/shoes2.jpeg" alt=""> 
           <h2>Shoes</h2>
           <p>Cheap Shoes</p>
        </div>
    </div>
</body>
</html>
