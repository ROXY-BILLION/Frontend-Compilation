<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Live Search Filter</h1>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <div class="products">
            <p class="product">Laptop</p>
            <p class="product">Keyboard</p>
            <p class="product">Mouse</p>
            <p class="product">Monitor</p>
            <p class="product">Printer</p>
            <p class="product">Speaker</p>
            <p class="product">Camera</p>
            <p class="product">Phone</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
